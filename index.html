<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Travel Company | Small-group Ladakh trips</title>
<meta name="description" content="Small-group Himalayan trips to Leh and Ladakh, planned day by day. Get the full itinerary and start your trip.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--sky:#EAF0F4;--sand:#E6D5BE;--ink:#1B2638;--mute:#55606E;--card:#ffffffb3;--edge:#ffffff;--night:#0F1727;--ember:#F08A2B;--flame:#E2521F;--glacier:#7FB0D3;
--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#121B2B;--sand:#1A2233;--ink:#EAF0F4;--mute:#A8B6C4;--card:#ffffff12;--edge:#ffffff22}}
:root[data-theme="dark"]{--sky:#121B2B;--sand:#1A2233;--ink:#EAF0F4;--mute:#A8B6C4;--card:#ffffff12;--edge:#ffffff22}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:400 1.08rem/1.65 var(--font)}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.05}p{max-width:60ch}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.4rem}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;margin-bottom:1.2rem}
.btn{display:inline-block;background:linear-gradient(135deg,var(--ember),var(--flame));color:#fff;font:700 1.1rem var(--font);padding:1rem 2rem;border-radius:999px;text-decoration:none;box-shadow:0 8px 30px #F08A2B66;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px #F08A2B99}
a:focus-visible,summary:focus-visible{outline:3px solid var(--glacier);outline-offset:3px}
/* scene: one photo behind hero + about */
.scene{position:relative;color:#fff}
.bgwrap{position:absolute;inset:0}
.stick{position:sticky;top:0;height:100svh;overflow:hidden;background:#1B2638}
.px{position:absolute;inset:0;display:block;will-change:transform}
.px img{position:absolute;left:0;top:-6%;width:100%;height:112%;object-fit:cover;object-position:50% 65%;animation:kb 26s ease-out both}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.tint{position:absolute;inset:0;background:linear-gradient(90deg,#09101Eb3,#09101E40 70%,#09101E1a)}
.dim{position:absolute;inset:0;background:#0A1222;opacity:var(--dim,.1)}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24vh;background:linear-gradient(#0000,var(--sky));pointer-events:none;z-index:3}
.nav{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.4rem}
.brand{display:flex;gap:.6rem;align-items:center;font-weight:800;text-decoration:none}
.nav .links a{margin-left:1.3rem;text-decoration:none;font-weight:600;opacity:.92}
@media(max-width:640px){.nav .links{display:none}}
.hero,.about{position:relative;z-index:4}
.hero{min-height:100svh;display:flex;align-items:center;padding-top:5rem}
.hero h1{font-size:clamp(3rem,9.5vw,7.4rem);font-weight:800;letter-spacing:-.045em;max-width:12ch;text-shadow:0 4px 30px #000a}
.hero p{font-size:clamp(1.1rem,2.4vw,1.4rem);margin:1.4rem 0 2.2rem;color:#F4ECE0;text-shadow:0 2px 12px #000a}
.flags{position:absolute;top:13%;left:0;width:100%;height:110px;pointer-events:none}
.flags path{fill:none;stroke:#fff8;stroke-width:1.3}
.flags rect{transform-origin:top center;animation:sway 3.4s ease-in-out infinite alternate}
.flags rect:nth-of-type(even){animation-delay:-1.5s}
@keyframes sway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.about{padding:14vh 0 26vh}
.glass{background:#0E162473;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid #ffffff2e;border-radius:32px;padding:clamp(1.6rem,4vw,3.2rem)}
.facts{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.fact{background:#ffffff1c;border:1px solid #ffffff2e;border-radius:20px;padding:.9rem 1.3rem}
.fact b{display:block;font-size:1.7rem;font-weight:800;color:#FFD9A0}
.fact span{font-size:.95rem;color:#DCE6EE}
/* lower page */
.lower{padding:4rem 0 5rem;background:linear-gradient(var(--sky),var(--sand))}
.rev{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.5rem 1.4rem 1.5rem;margin:0 -1.4rem;scrollbar-width:none}
.rev::-webkit-scrollbar{display:none}
.rev blockquote{flex:0 0 min(84%,380px);scroll-snap-align:center;margin:0;background:var(--card);border:1px solid var(--edge);border-radius:28px;padding:1.7rem;box-shadow:0 12px 40px #1B263614}
.rev blockquote p{margin:0 0 1.1rem;font-size:1.15rem}
.rev footer{font-weight:600;color:var(--mute);font-size:.95rem}
.faqs{margin-top:4rem}
details{background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:1.1rem 1.5rem;margin-bottom:.8rem;max-width:760px}
summary{cursor:pointer;font-weight:600;font-size:1.1rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;font-size:1.5rem;line-height:1;color:var(--flame)}
details[open] summary::after{content:"\2212"}
details p{margin:.7rem 0 0;color:var(--mute)}
/* night scene: one fire behind FAQ, contact and footer */
.night{position:relative;color:#EAF0F4}
.night::before{content:"";position:absolute;left:0;right:0;top:0;height:30vh;background:linear-gradient(var(--sand),#0000);z-index:1;pointer-events:none}
.nbg{position:absolute;inset:0}
.nstick{position:sticky;top:0;height:100svh;overflow:hidden;background:linear-gradient(#050913,#08101B 60%,#0B111A)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,#0000),radial-gradient(1px 1px at 90px 120px,#ffffffcc,#0000),radial-gradient(1.5px 1.5px at 160px 70px,#ffffff99,#0000),radial-gradient(1px 1px at 240px 180px,#fff,#0000),radial-gradient(2px 2px at 300px 40px,#FFE9C8,#0000);background-size:320px 220px;-webkit-mask-image:linear-gradient(#000 0,#000 50%,#0000 88%);mask-image:linear-gradient(#000 0,#000 50%,#0000 88%);animation:tw 5s ease-in-out infinite alternate}
.stars.s2{background-size:470px 330px;background-position:130px 90px;animation-duration:7s;animation-delay:-3s;opacity:.7}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.nlight{position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 88% 88%,#F08A2B59,#E2521F24 42%,#0000 72%),linear-gradient(270deg,#F08A2B2e,#0000 62%);animation:flk 2.4s ease-in-out infinite alternate}
@keyframes flk{0%{opacity:.7}40%{opacity:1}60%{opacity:.82}100%{opacity:.95}}
.fire{position:absolute;right:-6%;bottom:2%;width:min(78vw,980px);aspect-ratio:800/450;height:auto;z-index:2;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse 50% 56% at 50% 58%,#000 40%,#0000 100%);mask-image:radial-gradient(ellipse 50% 56% at 50% 58%,#000 40%,#0000 100%)}
#fxEmber{z-index:3}
@media(max-width:700px){.fire{width:125vw;right:-32%;bottom:0}}
.nsec,.camp,footer.f{position:relative;z-index:2}
.nsec{padding:14vh 0 6vh}
.night h2{color:#fff}
.night details{background:#ffffff12;border-color:#ffffff24}
.night details p{color:#AEBBC8}
.camp{padding:8vh 0 18vh}
.camp .wrap>*{max-width:560px}
.camp p{margin:0 0 2rem;color:#D3DDE7}
.camp small{display:block;margin-top:1.6rem;color:#9FB0C0}
footer.f{color:#7F91A3;text-align:center;padding:1.5rem;font-size:.9rem}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:9;padding:.85rem 1.4rem;font-size:1rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important}}
</style>
</head>
<body>
<div class="scene">
  <div class="bgwrap"><div class="stick">
    <picture class="px" id="px"><source id="srcMob" media="(max-width:700px)"><img id="srcDesk" width="1600" height="1067" fetchpriority="high"></picture>
    <div class="tint"></div><div class="dim" id="dim"></div><canvas class="fx" id="fxSnow"></canvas>
  </div></div>
  <header class="nav">
    <a class="brand" href="#top" id="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#fff"/><path d="M4 26 13 11l4 6 3-4 10 13z" fill="#14233B"/><circle cx="23" cy="9" r="2.5" fill="#F08A2B"/></svg><span></span></a>
    <nav class="links"><a href="#about">About</a><a href="#reviews">Reviews</a><a href="#faq">FAQ</a><a href="#contact">Contact</a></nav>
  </header>
  <main id="top">
    <!-- <section class="hero"><svg class="flags" id="flags" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 Q720 110 1440 20"/><g id="flagrow"></g></svg> -->
      <div class="wrap"><h1 id="hTitle"></h1><p id="hSub"></p><a class="btn" data-go href="#contact"></a></div></section>
    <section class="about" id="about"><div class="wrap"><div class="glass"><h2 id="aTitle"></h2><p id="aText"></p><div class="facts" id="aFacts"></div></div></div></section>
  </main>
</div>
<section class="lower"><div class="wrap"><h2 id="reviews">What travellers say</h2><div class="rev" id="revList"></div></div></section>
<div class="night" id="night">
  <div class="nbg"><div class="nstick"><div class="stars"></div><div class="stars s2"></div><div class="nlight" id="glow"></div>
    <video class="fire" id="fireVid" muted loop playsinline preload="none" aria-hidden="true"></video><canvas class="fx" id="fxEmber"></canvas></div></div>
  <section class="nsec" id="faq"><div class="wrap"><h2>Questions, answered</h2><div id="faqList"></div></div></section>
  <section class="camp" id="contact"><div class="wrap"><h2 id="cTitle"></h2><p id="cText"></p><a class="btn" data-go href="#contact"></a><small id="cMail"></small></div></section>
  <footer class="f">&copy; Demo Travel Company. Placeholder content.</footer>
</div>

<script>
/* ============================================================
   CONTROL PANEL. Edit only this block, like a phone's Settings.
   ============================================================ */
const SETTINGS={
  /* 1. Brand */
  brand:{name:"Demo Travel Company"},

  /* 2. Button and contact */
  contact:{
    number:"910000000000",            // country code + number, no + or spaces
    message:"Hi! I'd like the full itinerary for the Leh Ladakh trip.",
    buttonText:"Take me to the trip",
    title:"Your fire is lit.",
    text:"Say hello and we will send every day of the trip, planned out for you.",
    email:"hello@demotravel.example"
  },

  /* 3. Colours (page tones follow the light or dark theme automatically) */
  look:{ember:"#F08A2B", flame:"#E2521F", glacier:"#7FB0D3"},

  /* 4. Effects */
  effects:{
    weather:"snow",     // "snow", "sand" or "none"
    amount:60,          // how many flakes or grains (halved on phones)
    bonfire:true,       // bonfire, glow and embers
    embers:26,          // number of sparks
    flags:true,         // prayer flags in the hero
    parallax:true       // photo drifts and darkens while scrolling
  },

  /* 5. Photos */
  photos:{
    desktop:PHOTOS.desk,   // wide photo for laptops
    mobile:PHOTOS.mob,     // tall photo for phones
    fireVideo:PHOTOS.fire, // bonfire loop (plays only when scrolled into view)
    alt:"Snow peaks and barren brown mountains above the Leh valley"
  },

  /* 6. Page text */
  hero:{title:"Leh and Ladakh, one slow day at a time.", subtitle:"Small-group Himalayan trips with every day planned for you."},
  about:{
    title:"About us",
    text:"We plan trips for people who want to see the high desert, not rush past it. Every itinerary has rest days, local stays and a guide who knows the roads. Replace this text with your own story.",
    facts:[{big:"3,500 m",small:"Leh sits above the clouds. We plan rest days."},{big:"12 people",small:"Maximum group size."},{big:"Day by day",small:"See the full plan before you pay."}]
  },
  reviews:[
    {quote:"Sample review. The plan told us exactly what each day would feel like.",name:"Traveller name, City"},
    {quote:"Sample review. Pangong at sunrise was worth every early alarm.",name:"Traveller name, City"},
    {quote:"Sample review. Small group, kind guide, zero stress on the passes.",name:"Traveller name, City"}
  ],
  faq:[
    {q:"How do I get the full itinerary?",a:"Tap the trip button. A message opens ready to send, and we reply with the complete day-by-day plan."},
    {q:"Will altitude be a problem?",a:"We plan rest days at the start of each trip so your body can adjust. Sample answer, edit as needed."},
    {q:"What is included in the price?",a:"Stays, transport and guide. Sample answer, edit as needed."},
    {q:"When is the best time to go?",a:"Roughly June to September, when the roads are open. Sample answer, edit as needed."}
  ]
};
/* ===================== END OF CONTROL PANEL ===================== */

(function(){
const S=SETTINGS,$=id=>document.getElementById(id),E=S.effects;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,phone=innerWidth<700;
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
/* colours and text */
const r=document.documentElement.style;r.setProperty("--ember",S.look.ember);r.setProperty("--flame",S.look.flame);r.setProperty("--glacier",S.look.glacier);
$("brand").lastChild.textContent=S.brand.name;
$("srcMob").srcset=S.photos.mobile;const im=$("srcDesk");im.src=S.photos.desktop;im.alt=S.photos.alt;
$("hTitle").textContent=S.hero.title;$("hSub").textContent=S.hero.subtitle;
$("aTitle").textContent=S.about.title;$("aText").textContent=S.about.text;
S.about.facts.forEach(f=>{const d=el("div","fact");d.append(el("b",0,f.big),el("span",0,f.small));$("aFacts").append(d)});
S.reviews.forEach(v=>{const b=el("blockquote");b.append(el("p",0,v.quote),el("footer",0,v.name));$("revList").append(b)});
S.faq.forEach(f=>{const d=el("details");d.append(el("summary",0,f.q),el("p",0,f.a));$("faqList").append(d)});
$("cTitle").textContent=S.contact.title;$("cText").textContent=S.contact.text;$("cMail").textContent=S.contact.email;
const url="https://wa.me/"+S.contact.number+"?text="+encodeURIComponent(S.contact.message);
document.querySelectorAll("[data-go]").forEach(a=>{a.textContent=S.contact.buttonText;a.href=url;a.target="_blank";a.rel="noopener"});
/* switches */
if(!E.flags)$("flags").remove();
else{const cols=["#4F86C6","#F4F4F4","#D8443A","#3E9E68","#F0B02E"];let h="";for(let i=0;i<24;i++)h+='<rect x="'+(40+i*58)+'" y="'+(24+Math.sin(i/23*Math.PI)*62)+'" width="30" height="22" fill="'+cols[i%5]+'"/>';$("flagrow").innerHTML=h}
if(!E.bonfire){["fireVid","glow","fxEmber"].forEach(i=>$(i).remove())}
if(E.bonfire){const v=$("fireVid");
  new IntersectionObserver(es=>{if(es[0].isIntersecting){if(!v.src)v.src=S.photos.fireVideo;if(!reduce)v.play().catch(()=>{})}else v.pause()}).observe(v)}
/* particles: snow, sand or embers. Runs only while visible. */
function fx(cv,mode,n){
  if(!cv||!n||reduce||mode==="none")return;
  const c=cv.getContext("2d");let W,H,P=[],run=false,t=0;
  const size=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight};
  const mk=init=>({x:mode==="embers"?W*(.5+Math.random()*.45):Math.random()*W,y:init?Math.random()*H:(mode==="embers"?H+8:-8),r:Math.random()*2.2+.8,v:Math.random()*1+.4,w:Math.random()*6.28});
  const reset=p=>{const q=mk(false);if(mode==="sand"){q.x=-20;q.y=Math.random()*H}Object.assign(p,q)};
  size();addEventListener("resize",size);
  n=phone&&mode!=="embers"?Math.round(n/2):n;
  for(let i=0;i<n;i++)P.push(mk(true));
  function draw(){
    if(!run)return;t+=.01;c.clearRect(0,0,W,H);
    for(const p of P){
      if(mode==="snow"){p.y+=p.v;p.x+=Math.sin(t*2+p.w)*.5;c.fillStyle="rgba(255,255,255,.85)";c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill();if(p.y>H+8)reset(p)}
      else if(mode==="sand"){p.x+=p.v*5;p.y+=Math.sin(t*3+p.w)*.6;c.strokeStyle="rgba(226,196,150,.5)";c.lineWidth=p.r*.6;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.r*9,p.y);c.stroke();if(p.x>W+30)reset(p)}
      else{p.y-=p.v*1.1;p.x+=Math.sin(t*3+p.w)*.6;const a=Math.max(0,p.y/H);c.fillStyle="rgba(255,"+(120+a*90|0)+",50,"+a+")";c.beginPath();c.arc(p.x,p.y,p.r*.8,0,6.3);c.fill();if(p.y<-8)reset(p)}
    }
    requestAnimationFrame(draw)
  }
  new IntersectionObserver(es=>{const v=es[0].isIntersecting;if(v&&!run){run=true;draw()}else if(!v)run=false}).observe(cv)
}
fx($("fxSnow"),E.weather,E.amount);
if(E.bonfire)fx($("fxEmber"),"embers",E.embers);
/* scroll: photo drifts, sky darkens */
if(E.parallax&&!reduce){
  const px=$("px"),dim=$("dim"),sc=document.querySelector(".scene");let tick=false;
  const move=()=>{tick=false;const max=sc.offsetHeight-innerHeight,p=Math.min(1,Math.max(0,scrollY/max));px.style.transform="translateY("+(-p*7)+"%)";dim.style.setProperty("--dim",(.08+p*.5).toFixed(2))};
  addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(move)}},{passive:true});move()
}
})();
</script>
</body>
